
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Quiz | CyberSafe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('main.dashboard') }}">
            CyberSafe
        </a>

        <a href="{{ url_for('quiz.admin_quizzes') }}" class="btn btn-outline-info">
            Back to Quizzes
        </a>
    </div>
</nav>

<div class="container py-5">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <div class="dashboard-card">

        <span class="section-tag">ADMIN PANEL</span>
        <h2 class="mt-3">Edit Quiz</h2>

        <p class="text-secondary">
            Update the information of your existing quiz.
        </p>

        <form method="POST"
              action="{{ url_for('quiz.edit_quiz', quiz_id=quiz.id) }}">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label">Quiz Title</label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    maxlength="200"
                    value="{{ quiz.title }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>

                <select name="category" class="form-select" required>
                    <option value="">Select Category</option>

                    {% for category in [
                        'Password Security',
                        'Phishing Awareness',
                        'Network Security',
                        'Online Privacy',
                        'General Cybersecurity'
                    ] %}

                    <option value="{{ category }}"
                        {% if quiz.category == category %}selected{% endif %}>
                        {{ category }}
                    </option>

                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Quiz Description</label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="5">{{ quiz.description or '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary-custom">
                Update Quiz
            </button>

            <a href="{{ url_for('quiz.admin_quizzes') }}"
               class="btn btn-outline-info ms-2">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
