
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Quiz | CyberSafe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('main.dashboard') }}">
            CyberSafe
        </a>

        <a href="{{ url_for('quiz.admin_quizzes') }}" class="btn btn-outline-info">
            Back to Quizzes
        </a>
    </div>
</nav>

<div class="container py-5">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <div class="dashboard-card">

        <span class="section-tag">ADMIN PANEL</span>
        <h2 class="mt-3">Create New Quiz</h2>

        <p class="text-secondary">
            Enter the basic information for your cybersecurity quiz.
        </p>

        <form method="POST" action="{{ url_for('quiz.add_quiz') }}">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label">Quiz Title</label>
                <input
                    type="text"
                    name="title"
                    class="form-control"
                    maxlength="200"
                    placeholder="Example: Cybersecurity Basics"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>

                <select name="category" class="form-select" required>
                    <option value="">Select Category</option>
                    <option value="Password Security">Password Security</option>
                    <option value="Phishing Awareness">Phishing Awareness</option>
                    <option value="Network Security">Network Security</option>
                    <option value="Online Privacy">Online Privacy</option>
                    <option value="General Cybersecurity">General Cybersecurity</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Quiz Description</label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="5"
                    placeholder="Write a short description of this quiz..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary-custom">
                Create Quiz
            </button>

            <a href="{{ url_for('quiz.admin_quizzes') }}"
               class="btn btn-outline-info ms-2">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
