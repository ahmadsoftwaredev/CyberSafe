<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Security Tip | CyberSafe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container py-5">

    <div class="tool-card mx-auto">

        <h2>Edit Security Article</h2>

        <form method="POST">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label">Article Title</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       value="{{ tip.title }}"
                       maxlength="200"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <input type="text"
                       name="category"
                       class="form-control"
                       value="{{ tip.category }}"
                       maxlength="100"
                       required>
            </div>

            <div class="mb-4">
                <label class="form-label">Article Content</label>
                <textarea name="content"
                          class="form-control"
                          rows="8"
                          required>{{ tip.content }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100">
                Update Article
            </button>

        </form>

        <a href="{{ url_for('tips.admin_tips') }}"
           class="btn btn-outline-info mt-3 w-100">
            Back
        </a>

    </div>

</div>

</body>
</html>
