
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question | CyberSafe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('main.home') }}">
            CyberSafe
        </a>

        <a href="{{ url_for('quiz.manage_questions', quiz_id=quiz.id) }}"
           class="btn btn-outline-info">
            Back to Questions
        </a>
    </div>
</nav>

<div class="container py-5">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <div class="dashboard-card">

        <span class="section-tag">ADMIN PANEL</span>

        <h2 class="mt-3">Add New Question</h2>

        <p class="text-info">
            Quiz: {{ quiz.title }}
        </p>

        <form method="POST"
              action="{{ url_for('quiz.add_question', quiz_id=quiz.id) }}">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label">Question</label>

                <textarea
                    name="question_text"
                    class="form-control"
                    rows="3"
                    placeholder="Enter your question..."
                    required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Option A</label>
                <input type="text" name="option_a"
                       class="form-control" maxlength="500"
                       placeholder="Enter option A" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Option B</label>
                <input type="text" name="option_b"
                       class="form-control" maxlength="500"
                       placeholder="Enter option B" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Option C</label>
                <input type="text" name="option_c"
                       class="form-control" maxlength="500"
                       placeholder="Enter option C" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Option D</label>
                <input type="text" name="option_d"
                       class="form-control" maxlength="500"
                       placeholder="Enter option D" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Correct Answer</label>

                <select name="correct_answer"
                        class="form-select" required>
                    <option value="">Select Correct Answer</option>
                    <option value="A">Option A</option>
                    <option value="B">Option B</option>
                    <option value="C">Option C</option>
                    <option value="D">Option D</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Explanation (Optional)
                </label>

                <textarea
                    name="explanation"
                    class="form-control"
                    rows="3"
                    placeholder="Explain why this answer is correct..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary-custom">
                Save Question
            </button>

            <a href="{{ url_for('quiz.manage_questions', quiz_id=quiz.id) }}"
               class="btn btn-outline-info ms-2">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
