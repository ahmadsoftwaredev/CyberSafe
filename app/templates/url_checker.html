<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Phishing URL Checker | CyberSafe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('main.home') }}">
            CyberSafe
        </a>

        <a href="{{ url_for('main.dashboard') }}"
           class="btn btn-outline-info">
            Dashboard
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="tool-card mx-auto">

        <span class="section-tag">CYBERSECURITY TOOL</span>

        <h2 class="mt-3">Phishing URL Checker</h2>

        <p class="text-secondary">
            Examine a URL for common suspicious characteristics
            that may be associated with phishing.
        </p>

        <div class="mt-4">

            <label for="urlInput" class="form-label">
                Enter URL
            </label>

            <input
                type="text"
                id="urlInput"
                class="form-control"
                placeholder="https://example.com"
                autocomplete="off"
            >

            <button
                type="button"
                id="checkUrlButton"
                class="btn btn-primary-custom w-100 mt-3">
                Analyze URL
            </button>

        </div>

        <div id="urlResult" class="mt-4" aria-live="polite"></div>

        <div class="alert alert-info mt-4">
            <strong>Important:</strong> This tool performs a basic
            structural analysis only. It does not visit the URL or
            verify whether a website is safe or malicious.
        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/url_checker.js') }}"></script>

</body>
</html>
