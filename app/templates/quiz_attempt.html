
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ quiz.title }} | CyberSafe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('main.home') }}">
            CyberSafe
        </a>

        <a href="{{ url_for('quiz.available_quizzes') }}"
           class="btn btn-outline-info">
            Back to Quizzes
        </a>
    </div>
</nav>

<div class="container py-5">

    <span class="section-tag">QUIZ IN PROGRESS</span>

    <h1 class="mt-3">{{ quiz.title }}</h1>

    <p class="text-secondary mb-4">
        Category: {{ quiz.category }}
    </p>

    <form method="POST">

        <input type="hidden" name="csrf_token"
               value="{{ csrf_token() }}">

        {% for question in questions %}

        <div class="feature-card mb-4">

            <h5 class="mb-3">
                Question {{ loop.index }}:
                {{ question.question_text }}
            </h5>

            <div class="form-check mb-3">
                <input class="form-check-input"
                       type="radio"
                       name="question_{{ question.id }}"
                       id="q{{ question.id }}_a"
                       value="A"
                       required>

                <label class="form-check-label"
                       for="q{{ question.id }}_a">
                    A. {{ question.option_a }}
                </label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input"
                       type="radio"
                       name="question_{{ question.id }}"
                       id="q{{ question.id }}_b"
                       value="B">

                <label class="form-check-label"
                       for="q{{ question.id }}_b">
                    B. {{ question.option_b }}
                </label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input"
                       type="radio"
                       name="question_{{ question.id }}"
                       id="q{{ question.id }}_c"
                       value="C">

                <label class="form-check-label"
                       for="q{{ question.id }}_c">
                    C. {{ question.option_c }}
                </label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input"
                       type="radio"
                       name="question_{{ question.id }}"
                       id="q{{ question.id }}_d"
                       value="D">

                <label class="form-check-label"
                       for="q{{ question.id }}_d">
                    D. {{ question.option_d }}
                </label>
            </div>

        </div>

        {% endfor %}

        <div class="text-center mt-4">

            <button type="submit"
                    class="btn btn-primary-custom">
                Submit Quiz
            </button>

        </div>

    </form>

</div>

</body>
</html>
